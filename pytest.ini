[pytest]
# Ensure the project root is in PYTHONPATH to avoid ModuleNotFoundError
pythonpath = .

# Directory where pytest will look for test files
testpaths = tests

# Default command-line flags (-v: verbose output, --strict-markers: fail on unregistered markers)
addopts = -v --strict-markers

# Register custom markers to categorize test suites
markers =
    api: Tests targeting RESTful APIs
    ui: Tests targeting Web UI via Selenium
    hybrid: End-to-End tests combining API and UI layers
    smoke: Critical path tests for quick validation
    regression: Full suite testing all scenarios